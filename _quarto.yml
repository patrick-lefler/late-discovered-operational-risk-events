project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - data.qmd
    - results.qmd
    - ml-appendix.qmd
    - controls.qmd
    - reproducibility.qmd
    - license.qmd

website:
  title: "Late-Discovered Operational Risk Events"
  search: false
  page-navigation: true
  favicon: assets/images/favicon.svg
  sidebar:
    style: floating
    logo: assets/images/logo.svg
    logo-alt: "Seeking Eureka"
    contents:
      - {href: index.qmd, text: Overview}
      - {href: data.qmd, text: Synthetic Data}
      - {href: results.qmd, text: Results}
      - {href: controls.qmd, text: Control Value}
      - {href: reproducibility.qmd, text: Reproducibility}
      - {href: ml-appendix.qmd, text: ML appendix}
  page-footer:
    center: "© 2026 Patrick Lefler ⦁ [MIT License](license.qmd) ⦁ Built with R & Quarto"

format:
  html:
    code-copy: true
    code-fold: true
    code-overflow: wrap
    code-tools: true
    df-print: paged
    fig-align: center 
    fig-width: 10
    fig-height: 6
    highlight-style: arrow
    lightbox: true
    linkcolor: "#0166CC"
    number-sections: false
    page-layout: full
    smooth-scroll: true
    theme: [sandstone, theme.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "contents"

execute:
  echo: true
  freeze: auto
  warning: false
  message: false

knitr:
  opts_chunk:
    comment: "#>"

